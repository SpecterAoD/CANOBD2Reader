[platformio]
default_envs = sender, display

[env]
; Pinned: espressif32 8.0.0 = Arduino-ESP32 3.3.12 (ESP-IDF 5.5). Update deliberately.
platform = espressif32 @ 8.0.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; "chain" (not chain+): the "+" modes evaluate #if SOC_WIFI_SUPPORTED without
; knowing it and then miss the core library "Networking" (Arduino-ESP32 3.x).
lib_ldf_mode = chain
extra_scripts =
    pre:scripts/apply_firmware_version.py
    pre:scripts/auto_upload_port.py
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Iinclude
    -Iinclude/config
    -Ilib/common
    -Ilib/utils
    -Ilib/telemetry
    -Ilib/isotp
    -Ilib/can_router
    -Ilib/obd
    -Ilib/uds
    -Ilib/capabilities
    -Ilib/simulation
    -Ilib/power
    -Ilib/display
    -Ilib/status
    -Ilib/runtime
    -Ilib/web
    -Ilib/update
    -Ilib/wifi_station
    -Ilib/logging
    -Ilib/transport
    -Ilib/monocypher
    -Ilib/firmware_signing
    -Ilib/security
    -Ilib/diagnostics
    -DCORE_DEBUG_LEVEL=0
build_src_flags =
    -Wshadow
    -Wdouble-promotion
    -Wformat=2
    -Werror=return-type

; OTA: signierte Images ueber Web-Upload oder GitHub (docs/SECURITY.md).

[env:sender]
board = esp32dev
board_build.partitions = partitions/sender_4mb.csv
custom_upload_vid = 0x1A86
custom_upload_pid = 0x7523
build_src_filter =
    +<sender/>
    -<display/>
build_flags =
    ${env.build_flags}
    -DENV_SENDER
    -DCANOBD2_TARGET_NAME=\"sender\"
    -DCANOBD2_PROTOCOL_VERSION=3
    -DCANOBD2_ENABLE_SENDER_WEBCONSOLE=1
lib_deps =

[env:display]
board = lilygo-t-display-s3
board_build.partitions = partitions/display_16mb.csv
; ESP32-S3 USB-Serial ist mit 921600 je nach Kabel/Host oft instabil.
upload_speed = 460800
custom_upload_vid = 0x303A
custom_upload_pid = 0x1001
build_src_filter =
    +<display/>
    -<sender/>
build_flags =
    ${env.build_flags}
    -DENV_DISPLAY
    -DCANOBD2_TARGET_NAME=\"display\"
    -DCANOBD2_PROTOCOL_VERSION=3
    -DCANOBD2_ENABLE_DISPLAY_OTA=1
    ; LilyGo T-Display S3 nutzt beim integrierten ST7789 ein 8-Bit-Parallel-Interface.
    ; Die vorherige SPI-Konfiguration fuehrte zu einem Absturz in TFT_eSPI::init().
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    ; Fonts used by the renderer: 2 (16 px), 4 (26 px), 7 (7-segment 48 px).
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43

; Developer builds with simulation, capability scanner and CAN sniffer.
[env:sender_dev]
extends = env:sender
build_flags =
    ${env:sender.build_flags}
    -DCANOBD2_DEV_TOOLS=1

[env:display_dev]
extends = env:display
build_flags =
    ${env:display.build_flags}
    -DCANOBD2_DEV_TOOLS=1

[env:native]
platform = native
framework =
test_framework = unity
lib_ignore =
    common
build_flags =
    -std=c++17
    -DCANOBD2_DEV_TOOLS=1
    -DCANOBD2_IGNORE_LOCAL_SECRETS
    -DCANOBD2_TARGET_NAME=\"unknown\"
    -DCANOBD2_PROTOCOL_VERSION=3
    -Iinclude
    -Iinclude/config
    -Ilib/common
    -Ilib/utils
    -Ilib/telemetry
    -Ilib/isotp
    -Ilib/can_router
    -Ilib/obd
    -Ilib/uds
    -Ilib/capabilities
    -Ilib/simulation
    -Ilib/power
    -Ilib/display
    -Ilib/status
    -Ilib/runtime
    -Ilib/web
    -Ilib/update
    -Ilib/wifi_station
    -Ilib/logging
    -Ilib/transport
    -Ilib/monocypher
    -Ilib/firmware_signing
    -Ilib/security
    -Ilib/diagnostics
build_src_filter =
    +<../lib/utils/>
    +<../lib/telemetry/>
    +<../lib/isotp/>
    +<../lib/can_router/>
    +<../lib/obd/>
    +<../lib/uds/>
    +<../lib/capabilities/>
    +<../lib/simulation/>
    +<../lib/power/>
    +<../lib/display/>
    +<../lib/status/>
    +<../lib/runtime/>
    +<../lib/web/>
    +<../lib/update/>
    +<../lib/wifi_station/>
    +<../lib/logging/>
    +<../lib/transport/>
    +<../lib/monocypher/>
    +<../lib/firmware_signing/>
    +<../lib/security/>
    +<../lib/diagnostics/>
    -<*>
